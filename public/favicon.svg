<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hearth mark: the sidebar's lightning-on-yellow tile (Phosphor lightning-fill,
       exact glyph path) with gradient light for depth at larger favicon sizes. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe98c"/>
      <stop offset=".5" stop-color="#ffdd55"/>
      <stop offset="1" stop-color="#f2c235"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#a06a00" stop-opacity="0"/>
      <stop offset="1" stop-color="#a06a00" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="19" fill="url(#tile)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="18.4" fill="none" stroke="url(#shade)" stroke-width="1.5"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="18.4" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- Glyph grid is 256 with the bolt centered on (128,128); scale .17 ≈ 64% tile height. -->
  <g transform="translate(10.24 10.24) scale(.17)">
    <path transform="translate(0 6)" fill="#b57900" opacity=".32" d="M213.85,125.46l-112,120a8,8,0,0,1-13.69-7l14.66-73.33L45.19,143.49a8,8,0,0,1-3-13l112-120a8,8,0,0,1,13.69,7L153.18,90.9l57.63,21.61a8,8,0,0,1,3,12.95Z"/>
    <path fill="#0a0a0a" d="M213.85,125.46l-112,120a8,8,0,0,1-13.69-7l14.66-73.33L45.19,143.49a8,8,0,0,1-3-13l112-120a8,8,0,0,1,13.69,7L153.18,90.9l57.63,21.61a8,8,0,0,1,3,12.95Z"/>
  </g>
</svg>
